# =====================================================================
#  Configuracion de Serenity BDD
#  Ejercicio 01 - Prueba E2E del flujo de compra en SauceDemo
# =====================================================================

serenity {
  # Nombre que aparece en el encabezado del reporte HTML
  project.name = "Ejercicio 01 - E2E Compra SauceDemo (Serenity BDD + Cucumber + Screenplay)"

  # Evidencia: una captura por cada accion ejecutada.
  # Es mas pesado que FOR_FAILURES, pero el enunciado pide insumos que
  # sustenten la implementacion, y asi el reporte documenta el flujo completo.
  take.screenshots = FOR_EACH_ACTION

  # Navegador nuevo por escenario: evita arrastrar sesion o carrito entre pruebas.
  restart.browser.for.each = scenario

  # Detalle de los pasos en el reporte
  report.show.step.details = true
  report.show.manual.tests = false
  console.colors = true

  # Espera maxima por defecto de las interacciones Screenplay (ms)
  timeout = 10000
}

# Modo headless por defecto (CI-friendly).
# Para ver el navegador: -Dheadless.mode=false
headless.mode = true

webdriver {
  driver = chrome

  # Selenium Manager resuelve y descarga el chromedriver que corresponde
  # a la version de Chrome instalada. No se versiona ningun binario.
  autodownload = true

  timeouts {
    implicitlywait = 2000
    fluentwait = 10000
  }

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true

    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "--window-size=1366,900",
        "incognito",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "disable-dev-shm-usage",
        "disable-extensions",
        "disable-translate",
        "disable-search-engine-choice-screen",
        "disable-logging"
      ]
      excludeSwitches = ["enable-automation"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
      }
    }
  }
}

# ---------------------------------------------------------------------
#  Ambientes. Se selecciona con -Denvironment=<nombre>
#  (por defecto se usa "default")
# ---------------------------------------------------------------------
environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  produccion {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}
