# Ejecucion secuencial y determinista.
# El ejercicio tiene un unico escenario E2E; el paralelismo solo agregaria
# ruido al log y a las capturas del reporte.
cucumber.execution.parallel.enabled=false

# Los step definitions viven en este paquete
cucumber.glue=com.qa.saucedemo.stepdefinitions

# Los plugins (reporter de Serenity + salida "pretty") se declaran en
# CucumberTestSuite.java para que no haya dos fuentes de verdad.
